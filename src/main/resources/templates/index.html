<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>TOP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/top.css}">
</head>

<body>

    <div th:replace="~{common/header :: header(false)}"></div>

    <main class="top-main">
        <div class="top-wrapper">
            <section class="profile">
                <div class="profile-avatar">

                    <img
                        th:if="${session.loginUser.profileImage != null}"
                        th:src="@{/profile/image}"
                        alt="プロフィール画像">

                    <div
                        th:unless="${session.loginUser.profileImage != null}"
                        class="profile-avatar-placeholder">
                    </div>

                    <p
                        class="profile-name"
                        th:text="${session.loginUser.name}">
                    </p>
                </div>

                <div class="profile-content">
                    <div class="profile-title">
                        <h2>自己紹介</h2>
                        <hr class="profile-title-line">
                    </div>

                    <p
                        class="profile-text"
                        th:text="${session.loginUser.introduction}">
                    </p>

                    <a
                        th:href="@{/profile/edit}"
                        class="profile-edit-button">
                        自己紹介を編集する
                    </a>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{common/footer :: footer}"></div>

</body>

</html>
