<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>自己紹介編集</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/profile-edit.css}">
</head>

<body>

    <div th:replace="~{common/header :: header(false)}"></div>

    <main class="profile-edit-main">
        <div class="profile-edit-wrapper">

            <h1 class="profile-edit-title">
                自己紹介を編集する
            </h1>

            <form
                th:action="@{/profile/edit}"
                th:object="${profileEditRequest}"
                method="post"
                enctype="multipart/form-data">

                <div class="form-group">
                    <label
                        for="introduction"
                        class="form-label">
                        自己紹介
                    </label>

                    <textarea
                        id="introduction"
                        class="introduction-input"
                        th:field="*{introduction}">
                    </textarea>

                    <p class="form-description">
                        50文字以上、200文字以下で入力してください
                    </p>

                    <p
                        class="form-error"
                        th:if="${#fields.hasErrors('introduction')}">
                        自己紹介は50文字以上200文字以下で入力してください
                    </p>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        アバター画像
                    </label>

                    <div class="image-upload">
                        <label
                            for="profileImage"
                            class="image-upload-button">
                            画像ファイルを添付する
                        </label>

                        <span
                            id="fileName"
                            class="file-name">
                        </span>

                        <input
                            id="profileImage"
                            class="image-input"
                            type="file"
                            name="profileImage"
                            accept="image/*">
                    </div>
                </div>

                <button
                    type="submit"
                    class="profile-submit-button">
                    自己紹介を確定する
                </button>

            </form>
        </div>
    </main>

    <div th:replace="~{common/footer :: footer}"></div>

    <script>
        const profileImage = document.getElementById("profileImage");
        const fileName = document.getElementById("fileName");

        profileImage.addEventListener("change", function () {
            if (profileImage.files.length > 0) {
                fileName.textContent = profileImage.files[0].name;
            } else {
                fileName.textContent = "";
            }
        });
    </script>

</body>

</html>
